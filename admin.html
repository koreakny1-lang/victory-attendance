<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용인대 승리태권도 관리자</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f7fb;color:#17283d}
header{background:#062b5c;color:white;padding:18px}
header .inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:22px}
header button{background:white;color:#062b5c;border:0;padding:9px 15px;border-radius:9px;font-weight:700;cursor:pointer}

.container{max-width:1100px;margin:25px auto;padding:0 20px}
.card{background:white;border-radius:18px;padding:24px;margin-bottom:22px;box-shadow:0 5px 20px rgba(0,0,0,.06)}
h2{margin:0 0 18px;color:#062b5c}

.login{max-width:420px;margin:100px auto}

input,select{
width:100%;padding:12px;border:1px solid #d5dde7;border-radius:9px;font-size:15px;background:white
}

.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.full{grid-column:1/-1}

.primary{
width:100%;border:0;border-radius:10px;background:#0b5bd3;color:white;
padding:13px;font-size:16px;font-weight:700;cursor:pointer
}

.dashboard{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-bottom:22px
}

.stat{
background:white;border-radius:18px;padding:22px;
box-shadow:0 5px 20px rgba(0,0,0,.06);text-align:center
}

.stat-title{font-size:14px;color:#748195;margin-bottom:8px}
.stat-number{font-size:34px;font-weight:800;color:#062b5c}
.stat-number.blue{color:#0b5bd3}
.stat-number.red{color:#df3e3e}

.attendance-head,.birthday-head{
display:flex;justify-content:space-between;align-items:center;
gap:10px;margin-bottom:15px
}

.refresh,.birthday-button{
border:0;background:#edf3ff;color:#0b5bd3;
padding:9px 13px;border-radius:9px;font-weight:700;cursor:pointer
}

.attendance-item{
display:flex;justify-content:space-between;align-items:center;
padding:14px 4px;border-bottom:1px solid #edf0f4;gap:15px
}

.attendance-item:last-child{border-bottom:0}
.att-name{font-weight:800;color:#062b5c;font-size:17px}
.att-detail{font-size:13px;color:#758195;margin-top:5px}
.att-right{display:flex;align-items:center;gap:10px}
.att-time{font-weight:800;color:#079447;white-space:nowrap}

.att-delete{
border:0;background:#ffecec;color:#d63232;
padding:8px 11px;border-radius:8px;font-weight:700;cursor:pointer
}

.birthday-list{display:grid;gap:9px}

.birthday-item{
display:flex;align-items:center;justify-content:space-between;
padding:13px 15px;border:1px solid #e8edf4;border-radius:11px
}

.birthday-name{font-weight:800;color:#062b5c}
.birthday-date{font-weight:700;color:#e55476}

.search{margin-bottom:16px}

.student{
border:1px solid #e1e6ed;border-radius:13px;padding:15px;margin-bottom:10px;
display:flex;align-items:center;justify-content:space-between;gap:15px
}

.student-info{flex:1}

.student-name{
font-size:17px;font-weight:800;color:#062b5c;margin-bottom:7px
}

.student-main{
display:grid;
grid-template-columns:repeat(3,minmax(130px,1fr));
gap:7px 20px;
font-size:14px;color:#59687a
}

.student-main strong{color:#26384d}

.buttons{display:flex;gap:7px}

.edit,.delete{
border:0;padding:8px 12px;border-radius:8px;
cursor:pointer;font-weight:700
}

.edit{background:#e8f0ff;color:#0b5bd3}
.delete{background:#ffecec;color:#d63232}

.count{color:#6d7b8c;margin-bottom:13px}
.message{margin-top:14px;font-weight:700;text-align:center}
.success{color:#079447}
.error{color:#df3e3e}

.modal{
display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
justify-content:center;align-items:center;padding:20px;z-index:100
}

.modal-box{
background:white;width:100%;max-width:600px;border-radius:18px;
padding:24px;max-height:90vh;overflow:auto
}

.modal-buttons{display:flex;gap:10px;margin-top:18px}

.cancel{
width:100%;border:0;padding:13px;border-radius:10px;
cursor:pointer;font-weight:700
}

.empty{text-align:center;color:#8994a3;padding:25px}

.month-title{
font-size:17px;font-weight:800;color:#062b5c;
padding:12px 0 7px;border-bottom:2px solid #edf1f6;
margin-bottom:5px
}

@media(max-width:650px){
.form-grid{grid-template-columns:1fr}
.full{grid-column:auto}
.dashboard{grid-template-columns:1fr}
.student{display:block}
.buttons{margin-top:12px}
header h1{font-size:17px}
.student-main{grid-template-columns:1fr}
.attendance-item{align-items:flex-start}
.att-right{flex-direction:column;align-items:flex-end}
.birthday-head{align-items:flex-start}
}
</style>
</head>

<body>

<div id="loginScreen" class="container">
<div class="card login">

<h2>관리자 로그인</h2>
<p>용인대 승리태권도 출석관리</p>

<input id="password" type="password" inputmode="numeric"
placeholder="관리자 비밀번호"
onkeydown="if(event.key==='Enter') login()">

<br><br>

<button class="primary" onclick="login()">로그인</button>
<div id="loginMessage" class="message"></div>

</div>
</div>


<div id="adminScreen" style="display:none">

<header>
<div class="inner">
<h1>용인대 승리태권도 출석관리</h1>
<button onclick="logout()">로그아웃</button>
</div>
</header>

<div class="container">

<div class="dashboard">

<div class="stat">
<div class="stat-title">전체 재원생</div>
<div id="totalStudents" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-title">오늘 출석</div>
<div id="todayCount" class="stat-number blue">0</div>
</div>

<div class="stat">
<div class="stat-title">오늘 미출석</div>
<div id="absentCount" class="stat-number red">0</div>
</div>

</div>


<!-- 오늘 출석 -->
<div class="card">

<div class="attendance-head">
<h2 style="margin:0">오늘 출석현황</h2>
<button class="refresh" onclick="loadAll()">새로고침</button>
</div>

<div id="todayAttendance"></div>

</div>


<!-- 이번달 생일 -->
<div class="card">

<div class="birthday-head">
<div>
<h2 style="margin:0">🎂 이번 달 생일</h2>
<div id="birthdayCount" style="margin-top:5px;color:#758195;font-size:13px"></div>
</div>

<button class="birthday-button" onclick="openBirthdayModal()">
전체 생일보기
</button>
</div>

<div id="monthlyBirthdays" class="birthday-list"></div>

</div>


<!-- 수련생 등록 -->
<div class="card">

<h2>수련생 등록</h2>

<div class="form-grid">

<div class="field">
<label>이름 *</label>
<input id="name" placeholder="예: 김승리">
</div>

<div class="field">
<label>출석번호 4자리 *</label>
<input id="pin" maxlength="4" inputmode="numeric" placeholder="예: 1234">
</div>

<div class="field">
<label>학부모 연락처</label>
<input id="phone" inputmode="tel" placeholder="010-1234-5678">
</div>

<div class="field">
<label>생년월일</label>
<input id="birthDate" type="date">
</div>

<div class="field">
<label>수련반</label>
<input id="className" placeholder="예: 3부">
</div>

<div class="field">
<label>학교</label>
<input id="school" placeholder="예: 화정초">
</div>

<div class="field">
<label>학년</label>
<input id="grade" placeholder="예: 3학년">
</div>

<div class="field">
<label>띠</label>
<input id="belt" placeholder="예: 빨강띠">
</div>

<div class="field full">
<button class="primary" onclick="addStudent()">수련생 등록</button>
</div>

</div>

<div id="addMessage" class="message"></div>

</div>


<!-- 수련생 관리 -->
<div class="card">

<h2>수련생 관리</h2>

<input id="search" class="search"
placeholder="이름 · 출석번호 · 학부모 연락처 · 생년월일 검색"
oninput="renderStudents()">

<div id="count" class="count"></div>
<div id="studentList"></div>

</div>

</div>
</div>


<!-- 수정창 -->
<div id="editModal" class="modal">

<div class="modal-box">

<h2>수련생 정보 수정</h2>

<input type="hidden" id="editId">

<div class="form-grid">

<div class="field">
<label>이름</label>
<input id="editName">
</div>

<div class="field">
<label>출석번호</label>
<input id="editPin" maxlength="4" inputmode="numeric">
</div>

<div class="field">
<label>학부모 연락처</label>
<input id="editPhone">
</div>

<div class="field">
<label>생년월일</label>
<input id="editBirthDate" type="date">
</div>

<div class="field">
<label>수련반</label>
<input id="editClass">
</div>

<div class="field">
<label>학교</label>
<input id="editSchool">
</div>

<div class="field">
<label>학년</label>
<input id="editGrade">
</div>

<div class="field">
<label>띠</label>
<input id="editBelt">
</div>

<div class="field">
<label>상태</label>
<select id="editStatus">
<option value="재원">재원</option>
<option value="휴원">휴원</option>
<option value="퇴원">퇴원</option>
</select>
</div>

</div>

<div class="modal-buttons">
<button class="cancel" onclick="closeEdit()">취소</button>
<button class="primary" onclick="saveEdit()">수정 저장</button>
</div>

<div id="editMessage" class="message"></div>

</div>
</div>


<!-- 전체 생일 -->
<div id="birthdayModal" class="modal">

<div class="modal-box">

<h2>🎂 전체 관원생 생일</h2>

<div id="allBirthdays"></div>

<div class="modal-buttons">
<button class="cancel" onclick="closeBirthdayModal()">닫기</button>
</div>

</div>
</div>


<script>

const SUPABASE_URL="https://ixuxlblfkoccmwqxsjbw.supabase.co";
const SUPABASE_KEY="sb_publishable_lmwJJaHfZzE5hXnZnF49oA__F7JpDZ8";

let adminPassword="";
let students=[];
let todayAttendance=[];


async function rpc(name,data){

const response=await fetch(
SUPABASE_URL+"/rest/v1/rpc/"+name,
{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
},
body:JSON.stringify(data)
}
);

if(!response.ok){
throw new Error(await response.text());
}

return await response.json();
}


async function login(){

const password=document.getElementById("password").value.trim();
if(!password)return;

const message=document.getElementById("loginMessage");

message.className="message";
message.textContent="확인 중...";

try{

adminPassword=password;

await loadAll();

document.getElementById("loginScreen").style.display="none";
document.getElementById("adminScreen").style.display="block";

}catch(error){

adminPassword="";
message.className="message error";
message.textContent="관리자 비밀번호가 틀렸습니다.";

}

}


function logout(){

adminPassword="";
students=[];
todayAttendance=[];

document.getElementById("password").value="";
document.getElementById("adminScreen").style.display="none";
document.getElementById("loginScreen").style.display="block";

}


async function loadAll(){

await loadStudents();
await loadTodayAttendance();

updateDashboard();
renderBirthdays();

}


async function loadStudents(){

students=await rpc(
"admin_students",
{admin_password:adminPassword}
);

renderStudents();

}


async function loadTodayAttendance(){

todayAttendance=await rpc(
"admin_today_attendance",
{admin_password:adminPassword}
);

renderTodayAttendance();

}


function updateDashboard(){

const activeStudents=students.filter(s=>s.status==="재원");

const total=activeStudents.length;
const attended=todayAttendance.length;

document.getElementById("totalStudents").textContent=total;
document.getElementById("todayCount").textContent=attended;
document.getElementById("absentCount").textContent=
Math.max(0,total-attended);

}


function formatBirthDate(value){

if(!value)return "-";

const parts=value.split("-");

if(parts.length!==3)return value;

return parts[0]+"년 "+Number(parts[1])+"월 "+Number(parts[2])+"일";

}


function renderTodayAttendance(){

const box=document.getElementById("todayAttendance");
box.innerHTML="";

if(todayAttendance.length===0){

box.innerHTML=
'<div class="empty">아직 오늘 출석한 수련생이 없습니다.</div>';

return;
}

todayAttendance.forEach(a=>{

const row=document.createElement("div");
row.className="attendance-item";

const left=document.createElement("div");

const name=document.createElement("div");
name.className="att-name";
name.textContent=a.name;

const detail=document.createElement("div");
detail.className="att-detail";

detail.textContent=[
a.class_name,
a.school,
a.grade,
a.belt,
"출석번호 "+a.pin
].filter(Boolean).join(" · ");

left.appendChild(name);
left.appendChild(detail);


const right=document.createElement("div");
right.className="att-right";

const time=document.createElement("div");
time.className="att-time";

const date=new Date(a.checked_at);

time.textContent=date.toLocaleTimeString(
"ko-KR",
{
hour:"2-digit",
minute:"2-digit"
}
);


const deleteButton=document.createElement("button");
deleteButton.className="att-delete";
deleteButton.textContent="출석 삭제";
deleteButton.onclick=()=>deleteAttendance(a);

right.appendChild(time);
right.appendChild(deleteButton);

row.appendChild(left);
row.appendChild(right);

box.appendChild(row);

});

}


async function deleteAttendance(a){

if(!confirm(
a.name+" 수련생의 오늘 출석 기록만 삭제하시겠습니까?"
))return;

try{

const result=await rpc(
"admin_delete_attendance",
{
admin_password:adminPassword,
attendance_id:a.attendance_id
}
);

if(!result.success){
alert(result.message);
return;
}

await loadAll();

}catch(error){

alert("출석 삭제 중 오류가 발생했습니다.");

}

}


function getBirthdayStudents(){

return students
.filter(s=>s.status==="재원" && s.birth_date)
.sort((a,b)=>{

const aa=a.birth_date.substring(5);
const bb=b.birth_date.substring(5);

return aa.localeCompare(bb);

});

}


function renderBirthdays(){

const currentMonth=new Date().getMonth()+1;

const birthdays=getBirthdayStudents();

const monthly=birthdays.filter(s=>
Number(s.birth_date.split("-")[1])===currentMonth
);

const box=document.getElementById("monthlyBirthdays");
const count=document.getElementById("birthdayCount");

count.textContent=currentMonth+"월 생일 관원생 "+monthly.length+"명";

box.innerHTML="";

if(monthly.length===0){

box.innerHTML=
'<div class="empty">이번 달 생일인 관원생이 없습니다.</div>';

return;
}

monthly.forEach(s=>{

const item=document.createElement("div");
item.className="birthday-item";

const name=document.createElement("div");
name.className="birthday-name";
name.textContent="🎂 "+s.name;

const date=document.createElement("div");
date.className="birthday-date";

const p=s.birth_date.split("-");

date.textContent=
Number(p[1])+"월 "+Number(p[2])+"일";

item.appendChild(name);
item.appendChild(date);

box.appendChild(item);

});

}


function openBirthdayModal(){

const box=document.getElementById("allBirthdays");

box.innerHTML="";

const birthdays=getBirthdayStudents();

if(birthdays.length===0){

box.innerHTML=
'<div class="empty">생년월일이 등록된 관원생이 없습니다.</div>';

}else{

for(let month=1;month<=12;month++){

const monthly=birthdays.filter(s=>
Number(s.birth_date.split("-")[1])===month
);

if(monthly.length===0)continue;

const title=document.createElement("div");
title.className="month-title";
title.textContent=month+"월 · "+monthly.length+"명";

box.appendChild(title);

monthly.forEach(s=>{

const item=document.createElement("div");
item.className="birthday-item";

const name=document.createElement("div");
name.className="birthday-name";
name.textContent=s.name+" · "+s.pin;

const date=document.createElement("div");
date.className="birthday-date";

const p=s.birth_date.split("-");

date.textContent=
Number(p[1])+"월 "+Number(p[2])+"일";

item.appendChild(name);
item.appendChild(date);

box.appendChild(item);

});

}

}

document.getElementById("birthdayModal").style.display="flex";

}


function closeBirthdayModal(){

document.getElementById("birthdayModal").style.display="none";

}


async function addStudent(){

const name=document.getElementById("name").value.trim();
const pin=document.getElementById("pin").value.trim();
const message=document.getElementById("addMessage");

if(!name){

message.className="message error";
message.textContent="이름을 입력해주세요.";
return;

}

if(!/^\d{4}$/.test(pin)){

message.className="message error";
message.textContent="출석번호는 숫자 4자리로 입력해주세요.";
return;

}

message.className="message";
message.textContent="등록 중...";

try{

const result=await rpc(
"admin_add_student",
{
admin_password:adminPassword,
student_name:name,
student_pin:pin,
student_parent_phone:document.getElementById("phone").value.trim(),
student_birth_date:document.getElementById("birthDate").value || null,
student_class_name:document.getElementById("className").value.trim(),
student_school:document.getElementById("school").value.trim(),
student_grade:document.getElementById("grade").value.trim(),
student_belt:document.getElementById("belt").value.trim()
}
);

if(!result.success){

message.className="message error";
message.textContent=result.message;
return;

}

message.className="message success";
message.textContent="수련생 등록 완료!";

[
"name","pin","phone","birthDate",
"className","school","grade","belt"
].forEach(id=>document.getElementById(id).value="");

await loadAll();

}catch(error){

console.error(error);

message.className="message error";
message.textContent="등록 중 오류가 발생했습니다.";

}

}


function renderStudents(){

const search=document.getElementById("search");
if(!search)return;

const keyword=search.value.trim().toLowerCase();

const filtered=students.filter(s=>{

const text=[
s.name,
s.pin,
s.parent_phone,
s.birth_date
].join(" ").toLowerCase();

return text.includes(keyword);

});

document.getElementById("count").textContent=
"총 "+filtered.length+"명";

const list=document.getElementById("studentList");

list.innerHTML="";

if(filtered.length===0){

list.innerHTML=
'<div class="empty">등록된 수련생이 없습니다.</div>';

return;

}


filtered.forEach(s=>{

const item=document.createElement("div");
item.className="student";

const info=document.createElement("div");
info.className="student-info";

const name=document.createElement("div");
name.className="student-name";
name.textContent=s.name;

const main=document.createElement("div");
main.className="student-main";

main.innerHTML=
"<div><strong>출석번호</strong> "+(s.pin||"-")+"</div>"+
"<div><strong>학부모 연락처</strong> "+(s.parent_phone||"-")+"</div>"+
"<div><strong>생년월일</strong> "+formatBirthDate(s.birth_date)+"</div>";

info.appendChild(name);
info.appendChild(main);


const buttons=document.createElement("div");
buttons.className="buttons";

const edit=document.createElement("button");
edit.className="edit";
edit.textContent="수정";
edit.onclick=()=>openEdit(s);

const del=document.createElement("button");
del.className="delete";
del.textContent="삭제";
del.onclick=()=>deleteStudent(s);

buttons.appendChild(edit);
buttons.appendChild(del);

item.appendChild(info);
item.appendChild(buttons);

list.appendChild(item);

});

}


function openEdit(s){

document.getElementById("editId").value=s.id;
document.getElementById("editName").value=s.name||"";
document.getElementById("editPin").value=s.pin||"";
document.getElementById("editPhone").value=s.parent_phone||"";
document.getElementById("editBirthDate").value=s.birth_date||"";
document.getElementById("editClass").value=s.class_name||"";
document.getElementById("editSchool").value=s.school||"";
document.getElementById("editGrade").value=s.grade||"";
document.getElementById("editBelt").value=s.belt||"";
document.getElementById("editStatus").value=s.status||"재원";

document.getElementById("editMessage").textContent="";
document.getElementById("editModal").style.display="flex";

}


function closeEdit(){

document.getElementById("editModal").style.display="none";

}


async function saveEdit(){

const pin=document.getElementById("editPin").value.trim();
const message=document.getElementById("editMessage");

if(!/^\d{4}$/.test(pin)){

message.className="message error";
message.textContent="출석번호는 숫자 4자리여야 합니다.";
return;

}

try{

const result=await rpc(
"admin_update_student",
{
admin_password:adminPassword,
student_id:Number(document.getElementById("editId").value),
student_name:document.getElementById("editName").value.trim(),
student_pin:pin,
student_parent_phone:document.getElementById("editPhone").value.trim(),
student_birth_date:document.getElementById("editBirthDate").value || null,
student_class_name:document.getElementById("editClass").value.trim(),
student_school:document.getElementById("editSchool").value.trim(),
student_grade:document.getElementById("editGrade").value.trim(),
student_belt:document.getElementById("editBelt").value.trim(),
student_status:document.getElementById("editStatus").value
}
);

if(!result.success){

message.className="message error";
message.textContent=result.message;
return;

}

await loadAll();
closeEdit();

}catch(error){

console.error(error);

message.className="message error";
message.textContent="수정 중 오류가 발생했습니다.";

}

}
