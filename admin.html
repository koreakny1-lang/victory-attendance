<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>용인대 승리태권도 관리자</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f4f7fb;
  color:#17283d;
}

header{
  background:#062b5c;
  color:white;
  padding:20px;
}

header .inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:23px;
}

header button{
  background:white;
  color:#062b5c;
  border:0;
  padding:10px 16px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 20px;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

h2{
  margin-top:0;
  color:#062b5c;
}

.login{
  max-width:420px;
  margin:100px auto;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #d5dde7;
  border-radius:10px;
  font-size:16px;
  background:white;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.field label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:6px;
}

.full{
  grid-column:1/-1;
}

.primary{
  width:100%;
  border:0;
  border-radius:12px;
  background:#0b5bd3;
  color:white;
  padding:14px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.search{
  margin-bottom:18px;
}

.student{
  border:1px solid #e1e6ed;
  border-radius:14px;
  padding:16px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.student-info{
  flex:1;
}

.student-name{
  font-size:18px;
  font-weight:800;
  color:#062b5c;
}

.student-detail{
  margin-top:5px;
  font-size:14px;
  color:#6c7887;
  line-height:1.6;
}

.buttons{
  display:flex;
  gap:7px;
}

.edit,.delete{
  border:0;
  padding:9px 13px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.edit{
  background:#e8f0ff;
  color:#0b5bd3;
}

.delete{
  background:#ffecec;
  color:#d63232;
}

.count{
  color:#6d7b8c;
  margin-bottom:15px;
}

.message{
  margin-top:15px;
  font-weight:700;
  text-align:center;
}

.success{color:#079447}
.error{color:#df3e3e}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:520px;
  border-radius:20px;
  padding:25px;
  max-height:90vh;
  overflow:auto;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.cancel{
  width:100%;
  border:0;
  padding:13px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

@media(max-width:650px){
  .form-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .student{display:block}
  .buttons{margin-top:12px}
}
</style>
</head>

<body>

<div id="loginScreen" class="container">
  <div class="card login">
    <h2>관리자 로그인</h2>

    <p>용인대 승리태권도 출석관리</p>

    <input
      id="password"
      type="password"
      inputmode="numeric"
      placeholder="관리자 비밀번호"
      onkeydown="if(event.key==='Enter') login()"
    >

    <br><br>

    <button class="primary" onclick="login()">
      로그인
    </button>

    <div id="loginMessage" class="message"></div>
  </div>
</div>


<div id="adminScreen" style="display:none">

<header>
  <div class="inner">
    <h1>용인대 승리태권도 출석관리</h1>
    <button onclick="logout()">로그아웃</button>
  </div>
</header>


<div class="container">

<div class="card">

<h2>수련생 등록</h2>

<div class="form-grid">

<div class="field">
<label>이름 *</label>
<input id="name" placeholder="예: 김승리">
</div>

<div class="field">
<label>출석번호 4자리 *</label>
<input
  id="pin"
  maxlength="4"
  inputmode="numeric"
  placeholder="예: 1234"
>
</div>

<div class="field">
<label>학부모 연락처</label>
<input
  id="phone"
  inputmode="tel"
  placeholder="010-1234-5678"
>
</div>

<div class="field">
<label>수련반</label>
<input id="className" placeholder="예: 3부">
</div>

<div class="field">
<label>학교</label>
<input id="school" placeholder="예: 화정초">
</div>

<div class="field">
<label>학년</label>
<input id="grade" placeholder="예: 3학년">
</div>

<div class="field">
<label>띠</label>
<input id="belt" placeholder="예: 빨강띠">
</div>

<div class="field full">
<button class="primary" onclick="addStudent()">
수련생 등록
</button>
</div>

</div>

<div id="addMessage" class="message"></div>

</div>


<div class="card">

<h2>수련생 관리</h2>

<input
  id="search"
  class="search"
  placeholder="이름 · 학교 · 반 · 출석번호 검색"
  oninput="renderStudents()"
>

<div id="count" class="count"></div>

<div id="studentList"></div>

</div>

</div>
</div>


<div id="editModal" class="modal">

<div class="modal-box">

<h2>수련생 정보 수정</h2>

<input type="hidden" id="editId">

<div class="form-grid">

<div class="field">
<label>이름</label>
<input id="editName">
</div>

<div class="field">
<label>출석번호</label>
<input id="editPin" maxlength="4" inputmode="numeric">
</div>

<div class="field">
<label>학부모 연락처</label>
<input id="editPhone">
</div>

<div class="field">
<label>수련반</label>
<input id="editClass">
</div>

<div class="field">
<label>학교</label>
<input id="editSchool">
</div>

<div class="field">
<label>학년</label>
<input id="editGrade">
</div>

<div class="field">
<label>띠</label>
<input id="editBelt">
</div>

<div class="field">
<label>상태</label>
<select id="editStatus">
<option value="재원">재원</option>
<option value="휴원">휴원</option>
<option value="퇴원">퇴원</option>
</select>
</div>

</div>

<div class="modal-buttons">

<button class="cancel" onclick="closeEdit()">
취소
</button>

<button class="primary" onclick="saveEdit()">
수정 저장
</button>

</div>

<div id="editMessage" class="message"></div>

</div>
</div>


<script>

const SUPABASE_URL =
"https://ixuxlblfkoccmwqxsjbw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lmwJJaHfZzE5hXnZnF49oA__F7JpDZ8";

let adminPassword="";
let students=[];


async function rpc(name,data){

  const response=await fetch(
    SUPABASE_URL+"/rest/v1/rpc/"+name,
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY
      },
      body:JSON.stringify(data)
    }
  );

  if(!response.ok){
    throw new Error(await response.text());
  }

  return await response.json();
}


async function login(){

  const password=
    document.getElementById("password").value.trim();

  if(!password) return;

  const message=
    document.getElementById("loginMessage");

  message.className="message";
  message.textContent="확인 중...";

  try{

    adminPassword=password;

    await loadStudents();

    document.getElementById("loginScreen").style.display="none";
    document.getElementById("adminScreen").style.display="block";

  }catch(error){

    adminPassword="";

    message.className="message error";
    message.textContent="관리자 비밀번호가 틀렸습니다.";

  }
}


function logout(){

  adminPassword="";
  students=[];

  document.getElementById("password").value="";
  document.getElementById("adminScreen").style.display="none";
  document.getElementById("loginScreen").style.display="block";
}


async function loadStudents(){

  students=await rpc(
    "admin_students",
    {
      admin_password:adminPassword
    }
  );

  renderStudents();
}


async function addStudent(){

  const name=
    document.getElementById("name").value.trim();

  const pin=
    document.getElementById("pin").value.trim();

  const message=
    document.getElementById("addMessage");

  if(!name){

    message.className="message error";
    message.textContent="이름을 입력해주세요.";
    return;
  }

  if(!/^\d{4}$/.test(pin)){

    message.className="message error";
    message.textContent="출석번호는 숫자 4자리로 입력해주세요.";
    return;
  }

  message.className="message";
  message.textContent="등록 중...";

  try{

    const result=await rpc(
      "admin_add_student",
      {
        admin_password:adminPassword,
        student_name:name,
        student_pin:pin,
        student_parent_phone:
          document.getElementById("phone").value.trim(),
        student_class_name:
          document.getElementById("className").value.trim(),
        student_school:
          document.getElementById("school").value.trim(),
        student_grade:
          document.getElementById("grade").value.trim(),
        student_belt:
          document.getElementById("belt").value.trim()
      }
    );

    if(!result.success){

      message.className="message error";
      message.textContent=result.message;
      return;
    }

    message.className="message success";
    message.textContent="수련생 등록 완료!";

    [
      "name",
      "pin",
      "phone",
      "className",
      "school",
      "grade",
      "belt"
    ].forEach(id=>{
      document.getElementById(id).value="";
    });

    await loadStudents();

  }catch(error){

    message.className="message error";
    message.textContent="등록 중 오류가 발생했습니다.";

  }
}


function renderStudents(){

  const keyword=
    document.getElementById("search").value
      .trim()
      .toLowerCase();

  const filtered=students.filter(s=>{

    const text=[
      s.name,
      s.pin,
      s.parent_phone,
      s.class_name,
      s.school,
      s.grade,
      s.belt,
      s.status
    ].join(" ").toLowerCase();

    return text.includes(keyword);
  });


  document.getElementById("count").textContent=
    "총 "+filtered.length+"명";


  const list=
    document.getElementById("studentList");

  list.innerHTML="";


  if(filtered.length===0){

    list.innerHTML=
      "<div style='color:#7a8796'>등록된 수련생이 없습니다.</div>";

    return;
  }


  filtered.forEach(s=>{

    const item=document.createElement("div");
    item.className="student";

    const info=document.createElement("div");
    info.className="student-info";

    const name=document.createElement("div");
    name.className="student-name";
    name.textContent=s.name+" · "+s.pin;

    const detail=document.createElement("div");
    detail.className="student-detail";

    detail.textContent=[
      s.class_name,
      s.school,
      s.grade,
      s.belt,
      s.parent_phone,
      s.status
    ].filter(Boolean).join(" · ");

    info.appendChild(name);
    info.appendChild(detail);


    const buttons=document.createElement("div");
    buttons.className="buttons";


    const edit=document.createElement("button");
    edit.className="edit";
    edit.textContent="수정";
    edit.onclick=()=>openEdit(s);


    const del=document.createElement("button");
    del.className="delete";
    del.textContent="삭제";
    del.onclick=()=>deleteStudent(s);


    buttons.appendChild(edit);
    buttons.appendChild(del);

    item.appendChild(info);
    item.appendChild(buttons);

    list.appendChild(item);

  });
}


function openEdit(s){

  document.getElementById("editId").value=s.id;
  document.getElementById("editName").value=s.name || "";
  document.getElementById("editPin").value=s.pin || "";
  document.getElementById("editPhone").value=s.parent_phone || "";
  document.getElementById("editClass").value=s.class_name || "";
  document.getElementById("editSchool").value=s.school || "";
  document.getElementById("editGrade").value=s.grade || "";
  document.getElementById("editBelt").value=s.belt || "";
  document.getElementById("editStatus").value=s.status || "재원";

  document.getElementById("editMessage").textContent="";

  document.getElementById("editModal").style.display="flex";
}


function closeEdit(){
  document.getElementById("editModal").style.display="none";
}


async function saveEdit(){

  const pin=
    document.getElementById("editPin").value.trim();

  const message=
    document.getElementById("editMessage");

  if(!/^\d{4}$/.test(pin)){

    message.className="message error";
    message.textContent="출석번호는 숫자 4자리여야 합니다.";
    return;
  }


  try{

    const result=await rpc(
      "admin_update_student",
      {
        admin_password:adminPassword,
        student_id:Number(
          document.getElementById("editId").value
        ),
        student_name:
          document.getElementById("editName").value.trim(),
        student_pin:pin,
        student_parent_phone:
          document.getElementById("editPhone").value.trim(),
        student_class_name:
          document.getElementById("editClass").value.trim(),
        student_school:
          document.getElementById("editSchool").value.trim(),
        student_grade:
          document.getElementById("editGrade").value.trim(),
        student_belt:
          document.getElementById("editBelt").value.trim(),
        student_status:
          document.getElementById("editStatus").value
      }
    );


    if(!result.success){

      message.className="message error";
      message.textContent=result.message;
      return;
    }


    await loadStudents();

    closeEdit();

  }catch(error){

    message.className="message error";
    message.textContent="수정 중 오류가 발생했습니다.";

  }
}


async function deleteStudent(s){

  if(!confirm(
    s.name+" 수련생을 정말 삭제하시겠습니까?\n출석 기록도 함께 삭제됩니다."
  )){
    return;
  }


  try{

    const result=await rpc(
      "admin_delete_student",
      {
        admin_password:adminPassword,
        student_id:s.id
      }
    );


    if(!result.success){
      alert(result.message);
      return;
    }


    await loadStudents();

  }catch(error){

    alert("삭제 중 오류가 발생했습니다.");

  }
}

</script>

</body>
</html>
