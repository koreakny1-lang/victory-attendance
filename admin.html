<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>용인대 승리태권도 관리자</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;background:#f4f7fb;color:#17283d}
header{background:#062b5c;color:white;padding:18px;position:sticky;top:0;z-index:50}
header .inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:22px}
header .today{font-size:13px;opacity:.8;margin-top:3px}
header button{background:white;color:#062b5c;border:0;padding:9px 15px;border-radius:9px;font-weight:700;cursor:pointer}

.container{max-width:1100px;margin:25px auto;padding:0 20px}
.card{background:white;border-radius:18px;padding:24px;margin-bottom:22px;box-shadow:0 5px 20px rgba(0,0,0,.06)}
h2{margin:0 0 18px;color:#062b5c}

.login{max-width:420px;margin:100px auto}

input,select{
width:100%;padding:12px;border:1px solid #d5dde7;border-radius:9px;font-size:15px;background:white;font-family:inherit
}

.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.full{grid-column:1/-1}

button{font-family:inherit}

.primary{
width:100%;border:0;border-radius:10px;background:#0b5bd3;color:white;
padding:13px;font-size:16px;font-weight:700;cursor:pointer
}
.primary:disabled{opacity:.5}

.dashboard{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-bottom:22px
}

.stat{
background:white;border-radius:18px;padding:22px;
box-shadow:0 5px 20px rgba(0,0,0,.06);text-align:center
}

.stat-title{font-size:14px;color:#748195;margin-bottom:8px}
.stat-number{font-size:34px;font-weight:800;color:#062b5c}
.stat-number.blue{color:#0b5bd3}
.stat-number.red{color:#df3e3e}

.attendance-head,.birthday-head,.list-head{
display:flex;justify-content:space-between;align-items:center;
gap:10px;margin-bottom:15px;flex-wrap:wrap
}

.refresh,.birthday-button,.small-btn{
border:0;background:#edf3ff;color:#0b5bd3;
padding:9px 13px;border-radius:9px;font-weight:700;cursor:pointer;white-space:nowrap
}

.updated{font-size:12px;color:#97a3b3;margin-left:6px}

/* 출석 / 미출석 탭 */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{border:0;background:#eef2f7;color:#5b6b80;padding:10px 16px;border-radius:10px;font-weight:800;cursor:pointer}
.tab.on{background:#062b5c;color:#fff}

.attendance-item{
display:flex;justify-content:space-between;align-items:center;
padding:14px 4px;border-bottom:1px solid #edf0f4;gap:15px
}

.attendance-item:last-child{border-bottom:0}
.att-left{display:flex;align-items:center;gap:12px;min-width:0}
.att-photo{width:52px;height:52px;border-radius:12px;object-fit:cover;cursor:pointer;flex:0 0 52px;background:#eef2f7}
.att-name{font-weight:800;color:#062b5c;font-size:17px}
.att-detail{font-size:13px;color:#758195;margin-top:5px}
.att-right{display:flex;align-items:center;gap:10px}
.att-time{font-weight:800;color:#079447;white-space:nowrap}
.att-departed{font-size:13px;font-weight:800;color:#0b5bd3;white-space:nowrap;margin-top:5px}
.att-status{font-size:12px;font-weight:800;color:#986700;margin-top:4px}

.att-delete{
border:0;background:#ffecec;color:#d63232;
padding:8px 11px;border-radius:8px;font-weight:700;cursor:pointer;white-space:nowrap
}

.att-check{
border:0;background:#e6f6ec;color:#07803e;
padding:8px 11px;border-radius:8px;font-weight:800;cursor:pointer;white-space:nowrap
}

.birthday-list{display:grid;gap:9px}

.birthday-item{
display:flex;align-items:center;justify-content:space-between;
padding:13px 15px;border:1px solid #e8edf4;border-radius:11px
}

.birthday-name{font-weight:800;color:#062b5c}
.birthday-date{font-weight:700;color:#e55476}

.filters{display:grid;grid-template-columns:1fr 160px;gap:10px;margin-bottom:16px}

.student{
border:1px solid #e1e6ed;border-radius:13px;padding:15px;margin-bottom:10px;
display:flex;align-items:center;justify-content:space-between;gap:15px
}
.student.off{background:#fafbfc;opacity:.75}

.student-info{flex:1}

.student-name{
font-size:17px;font-weight:800;color:#062b5c;margin-bottom:7px;display:flex;align-items:center;gap:8px
}

.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:20px;background:#e6f6ec;color:#07803e}
.badge.휴원{background:#fff4e5;color:#b45f06}
.badge.퇴원{background:#eef0f3;color:#7a8696}

.student-main{
display:grid;
grid-template-columns:repeat(3,minmax(130px,1fr));
gap:7px 20px;
font-size:14px;color:#59687a
}

.student-main strong{color:#26384d}
.student-sub{font-size:13px;color:#8090a3;margin-top:7px}

.buttons{display:flex;gap:7px}

.edit,.delete{
border:0;padding:8px 12px;border-radius:8px;
cursor:pointer;font-weight:700
}

.edit{background:#e8f0ff;color:#0b5bd3}
.delete{background:#ffecec;color:#d63232}

.count{color:#6d7b8c;margin-bottom:13px}
.message{margin-top:14px;font-weight:700;text-align:center}
.success{color:#079447}
.error{color:#df3e3e}

.modal{
display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
justify-content:center;align-items:center;padding:20px;z-index:100
}

.modal-box{
background:white;width:100%;max-width:600px;border-radius:18px;
padding:24px;max-height:90vh;overflow:auto
}

.modal-buttons{display:flex;gap:10px;margin-top:18px}

.cancel{
width:100%;border:0;padding:13px;border-radius:10px;
cursor:pointer;font-weight:700
}

.empty{text-align:center;color:#8994a3;padding:25px}

.month-title{
font-size:17px;font-weight:800;color:#062b5c;
padding:12px 0 7px;border-bottom:2px solid #edf1f6;
margin-bottom:5px
}

.photo-view{max-width:100%;max-height:75vh;border-radius:14px;display:block;margin:0 auto}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17283d;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;display:none;z-index:200;max-width:90vw}

@media(max-width:650px){
.form-grid{grid-template-columns:1fr}
.full{grid-column:auto}
.dashboard{grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:14px 6px}
.stat-number{font-size:26px}
.stat-title{font-size:12px}
.student{display:block}
.buttons{margin-top:12px}
header h1{font-size:17px}
.student-main{grid-template-columns:1fr}
.attendance-item{align-items:flex-start}
.att-right{flex-direction:column;align-items:flex-end}
.birthday-head{align-items:flex-start}
.filters{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="loginScreen" class="container">
<div class="card login">

<h2>관리자 로그인</h2>
<p>용인대 승리태권도 출석관리</p>

<input id="password" type="password" inputmode="numeric"
placeholder="관리자 비밀번호"
onkeydown="if(event.key==='Enter') login()">

<br><br>

<button class="primary" id="loginBtn" onclick="login()">로그인</button>
<div id="loginMessage" class="message"></div>

</div>
</div>


<div id="adminScreen" style="display:none">

<header>
<div class="inner">
<div>
<h1>용인대 승리태권도 출석관리</h1>
<div id="todayLabel" class="today"></div>
</div>
<button onclick="logout()">로그아웃</button>
</div>
</header>

<div class="container">

<div class="dashboard">

<div class="stat">
<div class="stat-title">재원생</div>
<div id="totalStudents" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-title">오늘 출석</div>
<div id="todayCount" class="stat-number blue">0</div>
</div>

<div class="stat">
<div class="stat-title">오늘 미출석</div>
<div id="absentCount" class="stat-number red">0</div>
</div>

</div>


<!-- 오늘 출석 -->
<div class="card">

<div class="attendance-head">
<h2 style="margin:0">오늘 출석현황</h2>
<div>
<span id="updatedAt" class="updated"></span>
<button class="refresh" onclick="loadAll()">새로고침</button>
</div>
</div>

<div class="tabs">
<button class="tab on" id="tabPresent" onclick="setAttTab('present')">출석</button>
<button class="tab" id="tabAbsent" onclick="setAttTab('absent')">미출석</button>
</div>

<div id="todayAttendance"></div>
<div id="absentList" style="display:none"></div>

</div>


<!-- 이번달 생일 -->
<div class="card">

<div class="birthday-head">
<div>
<h2 style="margin:0">🎂 이번 달 생일</h2>
<div id="birthdayCount" style="margin-top:5px;color:#758195;font-size:13px"></div>
</div>

<button class="birthday-button" onclick="openBirthdayModal()">
전체 생일보기
</button>
</div>

<div id="monthlyBirthdays" class="birthday-list"></div>

</div>


<!-- 수련생 등록 -->
<div class="card">

<h2>수련생 등록</h2>

<div class="form-grid">

<div class="field">
<label>이름 *</label>
<input id="name" placeholder="예: 김승리">
</div>

<div class="field">
<label>출석번호 4자리 *</label>
<input id="pin" maxlength="4" inputmode="numeric" placeholder="예: 1234">
</div>

<div class="field">
<label>학부모 연락처</label>
<input id="phone" inputmode="tel" placeholder="010-1234-5678">
</div>

<div class="field">
<label>생년월일</label>
<input id="birthDate" type="date">
</div>

<div class="field">
<label>수련반</label>
<input id="className" placeholder="예: 3부" list="classList">
</div>

<div class="field">
<label>학교</label>
<input id="school" placeholder="예: 화정초">
</div>

<div class="field">
<label>학년</label>
<input id="grade" placeholder="예: 3학년">
</div>

<div class="field">
<label>띠</label>
<input id="belt" placeholder="예: 빨강띠">
</div>

<div class="field full">
<button class="primary" id="addBtn" onclick="addStudent()">수련생 등록</button>
</div>

</div>

<datalist id="classList"></datalist>

<div id="addMessage" class="message"></div>

</div>


<!-- 수련생 관리 -->
<div class="card">

<div class="list-head">
<h2 style="margin:0">수련생 관리</h2>
<button class="small-btn" onclick="exportStudents()">명단 엑셀(CSV) 받기</button>
</div>

<div class="filters">
<input id="search"
placeholder="이름 · 출석번호 · 연락처 · 수련반 · 학교 · 띠 검색"
oninput="renderStudents()">
<select id="statusFilter" onchange="renderStudents()">
<option value="">전체 상태</option>
<option value="재원" selected>재원만</option>
<option value="휴원">휴원만</option>
<option value="퇴원">퇴원만</option>
</select>
</div>

<div id="count" class="count"></div>
<div id="studentList"></div>

</div>

</div>
</div>


<!-- 수정창 -->
<div id="editModal" class="modal">

<div class="modal-box">

<h2>수련생 정보 수정</h2>

<div class="form-grid">

<div class="field">
<label>이름</label>
<input id="editName">
</div>

<div class="field">
<label>출석번호</label>
<input id="editPin" maxlength="4" inputmode="numeric">
</div>

<div class="field">
<label>학부모 연락처</label>
<input id="editPhone">
</div>

<div class="field">
<label>생년월일</label>
<input id="editBirthDate" type="date">
</div>

<div class="field">
<label>수련반</label>
<input id="editClass" list="classList">
</div>

<div class="field">
<label>학교</label>
<input id="editSchool">
</div>

<div class="field">
<label>학년</label>
<input id="editGrade">
</div>

<div class="field">
<label>띠</label>
<input id="editBelt">
</div>

<div class="field">
<label>상태</label>
<select id="editStatus">
<option value="재원">재원</option>
<option value="휴원">휴원</option>
<option value="퇴원">퇴원</option>
</select>
</div>

</div>

<div class="modal-buttons">
<button class="cancel" onclick="closeEdit()">취소</button>
<button class="primary" id="saveEditBtn" onclick="saveEdit()">수정 저장</button>
</div>

<div id="editMessage" class="message"></div>

</div>
</div>


<!-- 전체 생일 -->
<div id="birthdayModal" class="modal">

<div class="modal-box">

<h2>🎂 전체 관원생 생일</h2>

<div id="allBirthdays"></div>

<div class="modal-buttons">
<button class="cancel" onclick="closeBirthdayModal()">닫기</button>
</div>

</div>
</div>


<!-- 출석사진 크게 보기 -->
<div id="photoModal" class="modal" onclick="this.style.display='none'">
<div class="modal-box" style="max-width:520px;text-align:center">
<h2 id="photoTitle"></h2>
<img id="photoView" class="photo-view" alt="출석사진">
<div class="modal-buttons"><button class="cancel">닫기</button></div>
</div>
</div>

<div id="toast" class="toast"></div>


<script>

const SUPABASE_URL="https://ixuxlblfkoccmwqxsjbw.supabase.co";
const SUPABASE_KEY="sb_publishable_lmwJJaHfZzE5hXnZnF49oA__F7JpDZ8";

/* 오늘 출석현황 자동 새로고침 간격(초) */
const AUTO_REFRESH_SECONDS=30;

let adminPassword="";
let students=[];
let todayAttendance=[];
let editingStudent=null;
let attTab="present";
let refreshTimer=null;
let loading=false;


async function rpc(name,data){

const response=await fetch(
SUPABASE_URL+"/rest/v1/rpc/"+name,
{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
},
body:JSON.stringify(data)
}
);

if(!response.ok){
const err=new Error(await response.text());
err.status=response.status;
throw err;
}

return await response.json();
}


/* 로그인 유지용 저장 (저장이 막힌 브라우저에서도 오류 없이 동작) */
function store(action,value){
try{
if(action==="set")sessionStorage.setItem("victoryAdmin",value);
else if(action==="remove")sessionStorage.removeItem("victoryAdmin");
else return sessionStorage.getItem("victoryAdmin");
}catch(e){}
return null;
}


function toast(text){
const el=document.getElementById("toast");
el.textContent=text;
el.style.display="block";
clearTimeout(el._t);
el._t=setTimeout(()=>el.style.display="none",2600);
}


/* ---------- 로그인 ---------- */

async function login(savedPassword){

const password=(savedPassword||document.getElementById("password").value).trim();
if(!password)return;

const message=document.getElementById("loginMessage");
const button=document.getElementById("loginBtn");

message.className="message";
message.textContent="확인 중...";
button.disabled=true;

try{

adminPassword=password;

await loadAll(true);

/* 브라우저 탭을 닫기 전까지는 새로고침해도 로그인 유지 */
store("set",password);

document.getElementById("loginScreen").style.display="none";
document.getElementById("adminScreen").style.display="block";
message.textContent="";

startAutoRefresh();

}catch(error){

console.error(error);
adminPassword="";
store("remove");
message.className="message error";

if(error instanceof TypeError){
message.textContent="인터넷 연결을 확인해주세요.";
}else{
message.textContent="관리자 비밀번호가 틀렸습니다.";
}

}finally{
button.disabled=false;
}

}


function logout(){

stopAutoRefresh();
store("remove");

adminPassword="";
students=[];
todayAttendance=[];

document.getElementById("password").value="";
document.getElementById("adminScreen").style.display="none";
document.getElementById("loginScreen").style.display="block";

}


/* ---------- 자동 새로고침 ---------- */

function startAutoRefresh(){
stopAutoRefresh();
refreshTimer=setInterval(async()=>{
if(document.visibilityState!=="visible")return;
if(document.getElementById("editModal").style.display==="flex")return;
try{
await loadTodayAttendance();
updateDashboard();
renderAbsent();
}catch(e){}
},AUTO_REFRESH_SECONDS*1000);
}

function stopAutoRefresh(){
clearInterval(refreshTimer);
refreshTimer=null;
}

document.addEventListener("visibilitychange",()=>{
if(document.visibilityState==="visible" && adminPassword){
loadAll().catch(()=>{});
}
});


async function loadAll(throwOnError){

if(loading && !throwOnError)return;
loading=true;

try{

const results=await Promise.all([
rpc("admin_students",{admin_password:adminPassword}),
rpc("admin_today_attendance",{admin_password:adminPassword}),
rpc("admin_today_departures",{admin_password:adminPassword})
]);

students=Array.isArray(results[0])?results[0]:[];
todayAttendance=Array.isArray(results[1])?results[1]:[];
mergeDepartures(results[2]);

renderStudents();
renderTodayAttendance();
renderAbsent();
updateDashboard();
renderBirthdays();
fillClassList();

}catch(error){

if(throwOnError)throw error;
console.error(error);
toast("불러오기 실패: 인터넷 연결을 확인해주세요.");

}finally{

loading=false;

}

}


function mergeDepartures(departures){
  const map=new Map((Array.isArray(departures)?departures:[]).map(d=>[String(d.attendance_id),d.departed_at]));
  todayAttendance=todayAttendance.map(a=>({...a,departed_at:map.get(String(a.attendance_id))||null}));
}

async function loadTodayAttendance(){
  const results=await Promise.all([
    rpc("admin_today_attendance",{admin_password:adminPassword}),
    rpc("admin_today_departures",{admin_password:adminPassword})
  ]);
  todayAttendance=Array.isArray(results[0])?results[0]:[];
  mergeDepartures(results[1]);
  renderTodayAttendance();
}


/* ---------- 대시보드 ---------- */

function activeStudents(){
return students.filter(s=>(s.status||"재원")==="재원");
}

/* 오늘 출석한 출석번호 목록 (중복 제거) */
function attendedPins(){
return new Set(todayAttendance.map(a=>String(a.pin)));
}

function updateDashboard(){

const active=activeStudents();
const pins=attendedPins();

const attendedActive=active.filter(s=>pins.has(String(s.pin))).length;

document.getElementById("totalStudents").textContent=active.length;
document.getElementById("todayCount").textContent=pins.size;
document.getElementById("absentCount").textContent=
Math.max(0,active.length-attendedActive);

document.getElementById("tabPresent").textContent="출석 "+pins.size;
document.getElementById("tabAbsent").textContent="미출석 "+Math.max(0,active.length-attendedActive);

document.getElementById("todayLabel").textContent=
new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});

document.getElementById("updatedAt").textContent=
new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})+" 갱신";

}


function setAttTab(tab){
attTab=tab;
document.getElementById("tabPresent").classList.toggle("on",tab==="present");
document.getElementById("tabAbsent").classList.toggle("on",tab==="absent");
document.getElementById("todayAttendance").style.display=tab==="present"?"block":"none";
document.getElementById("absentList").style.display=tab==="absent"?"block":"none";
}


function formatBirthDate(value){

if(!value)return "-";

const parts=value.split("-");

if(parts.length!==3)return value;

return parts[0]+"년 "+Number(parts[1])+"월 "+Number(parts[2])+"일";

}


function el(tag,className,text){
const e=document.createElement(tag);
if(className)e.className=className;
if(text!==undefined&&text!==null)e.textContent=text;
return e;
}


/* ---------- 오늘 출석 목록 ---------- */

function renderTodayAttendance(){

const box=document.getElementById("todayAttendance");
box.innerHTML="";

if(todayAttendance.length===0){

box.appendChild(el("div","empty","아직 오늘 출석한 수련생이 없습니다."));
return;

}

/* 최근 출석이 위로 */
const list=[...todayAttendance].sort((a,b)=>
new Date(b.checked_at)-new Date(a.checked_at)
);

list.forEach(a=>{

const row=el("div","attendance-item");

const left=el("div","att-left");

/* 출석사진이 있으면 작게 표시 (누르면 크게) */
const photoUrl=a.photo_url||a.photo||a.image_url||"";

if(photoUrl){
const img=el("img","att-photo");
img.src=photoUrl;
img.alt=a.name+" 출석사진";
img.loading="lazy";
img.onclick=()=>openPhoto(a.name,photoUrl);
left.appendChild(img);
}

const textBox=el("div");

textBox.appendChild(el("div","att-name",a.name));

textBox.appendChild(el("div","att-detail",[
a.class_name,
a.school,
a.grade,
a.belt,
"출석번호 "+a.pin
].filter(Boolean).join(" · ")));

left.appendChild(textBox);


const right=el("div","att-right");

const date=new Date(a.checked_at);

right.appendChild(el("div","att-time",
"출석 "+(isNaN(date.getTime())?"-":date.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}))
));

if(a.departed_at){
  const departed=new Date(a.departed_at);
  right.appendChild(el("div","att-departed","🏠 귀가 "+(isNaN(departed.getTime())?"-":departed.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}))));
}else{
  right.appendChild(el("div","att-status","🥋 수련 중"));
}

const deleteButton=el("button","att-delete","출석 삭제");
deleteButton.onclick=()=>deleteAttendance(a);

right.appendChild(deleteButton);

row.appendChild(left);
row.appendChild(right);

box.appendChild(row);

});

}


/* ---------- 오늘 미출석 목록 + 수동 출석 ---------- */

function renderAbsent(){

const box=document.getElementById("absentList");
box.innerHTML="";

const pins=attendedPins();

const absent=activeStudents()
.filter(s=>!pins.has(String(s.pin)))
.sort((a,b)=>(a.class_name||"").localeCompare(b.class_name||"","ko")||(a.name||"").localeCompare(b.name||"","ko"));

if(absent.length===0){
box.appendChild(el("div","empty","재원생 모두 출석했습니다 👏"));
return;
}

absent.forEach(s=>{

const row=el("div","attendance-item");

const left=el("div");
left.appendChild(el("div","att-name",s.name));
left.appendChild(el("div","att-detail",[
s.class_name,
s.school,
s.grade,
"출석번호 "+s.pin,
s.parent_phone
].filter(Boolean).join(" · ")));

const right=el("div","att-right");
const btn=el("button","att-check","출석 처리");
btn.onclick=()=>manualCheck(s,btn);
right.appendChild(btn);

row.appendChild(left);
row.appendChild(right);
box.appendChild(row);

});

}


async function manualCheck(s,btn){

if(!confirm(s.name+" 수련생을 지금 출석 처리할까요?"))return;

const notify=confirm("부모님께 출석 알림도 보낼까요?\n\n확인 = 알림 보냄 / 취소 = 기록만");

btn.disabled=true;
btn.textContent="처리 중...";

try{

/* 출석 화면과 같은 출석 처리 기능 사용 */
const result=await rpc("check_attendance",{input_pin:String(s.pin)});

if(!result.success){
toast(result.already?(s.name+" 수련생은 이미 출석했습니다."):(result.message||"출석 처리 실패"));
await loadAll();
return;
}

let pushText="";

if(notify){
try{
const r=await fetch(SUPABASE_URL+"/functions/v1/send-push",{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
},
body:JSON.stringify({pin:String(s.pin)})
});
pushText=r.ok?" · 부모님 알림 보냄":" · 알림 실패";
}catch(e){
pushText=" · 알림 실패";
}
}

toast(s.name+" 출석 처리 완료"+pushText);
await loadAll();

}catch(error){

console.error(error);
toast("출석 처리 중 오류가 발생했습니다.");
btn.disabled=false;
btn.textContent="출석 처리";

}

}


async function deleteAttendance(a){

if(!confirm(
a.name+" 수련생의 오늘 출석 기록만 삭제하시겠습니까?"
))return;

try{

const result=await rpc(
"admin_delete_attendance",
{
admin_password:adminPassword,
attendance_id:a.attendance_id
}
);

if(!result.success){
alert(result.message);
return;
}

toast(a.name+" 출석 기록을 삭제했습니다.");
await loadAll();

}catch(error){

alert("출석 삭제 중 오류가 발생했습니다.");

}

}


function openPhoto(name,url){
document.getElementById("photoTitle").textContent=name+" 출석사진";
document.getElementById("photoView").src=url;
document.getElementById("photoModal").style.display="flex";
}


/* ---------- 생일 ---------- */

function getBirthdayStudents(){

return students
.filter(s=>(s.status||"재원")==="재원" && s.birth_date)
.sort((a,b)=>{

const aa=a.birth_date.substring(5);
const bb=b.birth_date.substring(5);

return aa.localeCompare(bb);

});

}


function renderBirthdays(){

const now=new Date();
const currentMonth=now.getMonth()+1;
const todayMD=String(currentMonth).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");

const birthdays=getBirthdayStudents();

const monthly=birthdays.filter(s=>
Number(s.birth_date.split("-")[1])===currentMonth
);

const box=document.getElementById("monthlyBirthdays");
const count=document.getElementById("birthdayCount");

count.textContent=currentMonth+"월 생일 관원생 "+monthly.length+"명";

box.innerHTML="";

if(monthly.length===0){

box.appendChild(el("div","empty","이번 달 생일인 관원생이 없습니다."));
return;

}

monthly.forEach(s=>{

const item=el("div","birthday-item");

const isToday=s.birth_date.substring(5)===todayMD;

item.appendChild(el("div","birthday-name",(isToday?"🎉 오늘! ":"🎂 ")+s.name));

const p=s.birth_date.split("-");

item.appendChild(el("div","birthday-date",Number(p[1])+"월 "+Number(p[2])+"일"));

if(isToday)item.style.background="#fff4f7";

box.appendChild(item);

});

}


function openBirthdayModal(){

const box=document.getElementById("allBirthdays");

box.innerHTML="";

const birthdays=getBirthdayStudents();

if(birthdays.length===0){

box.appendChild(el("div","empty","생년월일이 등록된 관원생이 없습니다."));

}else{

for(let month=1;month<=12;month++){

const monthly=birthdays.filter(s=>
Number(s.birth_date.split("-")[1])===month
);

if(monthly.length===0)continue;

box.appendChild(el("div","month-title",month+"월 · "+monthly.length+"명"));

monthly.forEach(s=>{

const item=el("div","birthday-item");

item.appendChild(el("div","birthday-name",s.name+" · "+s.pin));

const p=s.birth_date.split("-");

item.appendChild(el("div","birthday-date",Number(p[1])+"월 "+Number(p[2])+"일"));

box.appendChild(item);

});

}

}

document.getElementById("birthdayModal").style.display="flex";

}


function closeBirthdayModal(){

document.getElementById("birthdayModal").style.display="none";

}


/* ---------- 수련생 등록 ---------- */

function fillClassList(){
const classes=[...new Set(students.map(s=>s.class_name).filter(Boolean))].sort();
const list=document.getElementById("classList");
list.innerHTML="";
classes.forEach(c=>{
const o=document.createElement("option");
o.value=c;
list.appendChild(o);
});
}

/* 출석번호 중복을 저장 전에 미리 확인 */
function pinOwner(pin,exceptId){
return students.find(s=>String(s.pin)===String(pin) && String(s.id)!==String(exceptId));
}

async function addStudent(){

const name=document.getElementById("name").value.trim();
const pin=document.getElementById("pin").value.trim();
const message=document.getElementById("addMessage");
const button=document.getElementById("addBtn");

if(!name){

message.className="message error";
message.textContent="이름을 입력해주세요.";
return;

}

if(!/^\d{4}$/.test(pin)){

message.className="message error";
message.textContent="출석번호는 숫자 4자리로 입력해주세요.";
return;

}

const owner=pinOwner(pin,null);

if(owner){

message.className="message error";
message.textContent="출석번호 "+pin+"은(는) 이미 "+owner.name+" 수련생이 사용 중입니다.";
return;

}

message.className="message";
message.textContent="등록 중...";
button.disabled=true;

try{

const result=await rpc(
"admin_add_student",
{
admin_password:adminPassword,
student_name:name,
student_pin:pin,
student_parent_phone:document.getElementById("phone").value.trim(),
student_birth_date:document.getElementById("birthDate").value || null,
student_class_name:document.getElementById("className").value.trim(),
student_school:document.getElementById("school").value.trim(),
student_grade:document.getElementById("grade").value.trim(),
student_belt:document.getElementById("belt").value.trim()
}
);

if(!result.success){

message.className="message error";
message.textContent=result.message;
return;

}

message.className="message success";
message.textContent=name+" 수련생 등록 완료! (출석번호 "+pin+")";

[
"name","pin","phone","birthDate",
"className","school","grade","belt"
].forEach(id=>document.getElementById(id).value="");

await loadAll();

}catch(error){

console.error(error);

message.className="message error";
message.textContent="등록 중 오류가 발생했습니다.";

}finally{

button.disabled=false;

}

}


/* ---------- 수련생 목록 ---------- */

function renderStudents(){

const search=document.getElementById("search");
if(!search)return;

const keyword=search.value.trim().toLowerCase();
const status=document.getElementById("statusFilter").value;

const filtered=students.filter(s=>{

if(status && (s.status||"재원")!==status)return false;

const text=[
s.name,
s.pin,
s.parent_phone,
String(s.parent_phone||"").replace(/\D/g,""),
s.birth_date,
s.class_name,
s.school,
s.grade,
s.belt
].join(" ").toLowerCase();

return text.includes(keyword);

}).sort((a,b)=>(a.name||"").localeCompare(b.name||"","ko"));

const byStatus={재원:0,휴원:0,퇴원:0};
students.forEach(s=>{byStatus[s.status||"재원"]=(byStatus[s.status||"재원"]||0)+1;});

document.getElementById("count").textContent=
"검색 결과 "+filtered.length+"명 · 전체 재원 "+byStatus.재원+" / 휴원 "+byStatus.휴원+" / 퇴원 "+byStatus.퇴원;

const list=document.getElementById("studentList");

list.innerHTML="";

if(filtered.length===0){

list.appendChild(el("div","empty","해당하는 수련생이 없습니다."));
return;

}


filtered.forEach(s=>{

const st=s.status||"재원";

const item=el("div","student"+(st!=="재원"?" off":""));

const info=el("div","student-info");

const name=el("div","student-name");
name.appendChild(el("span","",s.name));
name.appendChild(el("span","badge "+st,st));

const main=el("div","student-main");

[
["출석번호",s.pin||"-"],
["학부모 연락처",s.parent_phone||"-"],
["생년월일",formatBirthDate(s.birth_date)]
].forEach(([k,v])=>{
const d=el("div");
d.appendChild(el("strong","",k));
d.appendChild(document.createTextNode(" "+v));
main.appendChild(d);
});

info.appendChild(name);
info.appendChild(main);

const sub=[s.class_name,s.school,s.grade,s.belt].filter(Boolean).join(" · ");
if(sub)info.appendChild(el("div","student-sub",sub));


const buttons=el("div","buttons");

const edit=el("button","edit","수정");
edit.onclick=()=>openEdit(s);

const del=el("button","delete","삭제");
del.onclick=()=>deleteStudent(s);

buttons.appendChild(edit);
buttons.appendChild(del);

item.appendChild(info);
item.appendChild(buttons);

list.appendChild(item);

});

}


function exportStudents(){

const rows=[["이름","출석번호","학부모연락처","생년월일","수련반","학교","학년","띠","상태"]];

[...students]
.sort((a,b)=>(a.name||"").localeCompare(b.name||"","ko"))
.forEach(s=>rows.push([s.name,s.pin,s.parent_phone,s.birth_date,s.class_name,s.school,s.grade,s.belt,s.status||"재원"]));

const csv="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");

const a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
a.download="승리태권도_수련생명단_"+new Date().toISOString().slice(0,10)+".csv";
a.click();

}


/* ---------- 수정 ---------- */

function openEdit(s){

editingStudent=s;

document.getElementById("editName").value=s.name||"";
document.getElementById("editPin").value=s.pin||"";
document.getElementById("editPhone").value=s.parent_phone||"";
document.getElementById("editBirthDate").value=s.birth_date||"";
document.getElementById("editClass").value=s.class_name||"";
document.getElementById("editSchool").value=s.school||"";
document.getElementById("editGrade").value=s.grade||"";
document.getElementById("editBelt").value=s.belt||"";
document.getElementById("editStatus").value=s.status||"재원";

document.getElementById("editMessage").textContent="";
document.getElementById("editModal").style.display="flex";

}


function closeEdit(){

editingStudent=null;
document.getElementById("editModal").style.display="none";

}


async function saveEdit(){

if(!editingStudent)return;

const pin=document.getElementById("editPin").value.trim();
const name=document.getElementById("editName").value.trim();
const message=document.getElementById("editMessage");
const button=document.getElementById("saveEditBtn");

if(!name){
message.className="message error";
message.textContent="이름을 입력해주세요.";
return;
}

if(!/^\d{4}$/.test(pin)){

message.className="message error";
message.textContent="출석번호는 숫자 4자리여야 합니다.";
return;

}

const owner=pinOwner(pin,editingStudent.id);

if(owner){
message.className="message error";
message.textContent="출석번호 "+pin+"은(는) 이미 "+owner.name+" 수련생이 사용 중입니다.";
return;
}

button.disabled=true;

try{

const result=await rpc(
"admin_update_student",
{
admin_password:adminPassword,
student_id:editingStudent.id,
student_name:name,
student_pin:pin,
student_parent_phone:document.getElementById("editPhone").value.trim(),
student_birth_date:document.getElementById("editBirthDate").value || null,
student_class_name:document.getElementById("editClass").value.trim(),
student_school:document.getElementById("editSchool").value.trim(),
student_grade:document.getElementById("editGrade").value.trim(),
student_belt:document.getElementById("editBelt").value.trim(),
student_status:document.getElementById("editStatus").value
}
);

if(!result.success){

message.className="message error";
message.textContent=result.message;
return;

}

toast(name+" 정보를 저장했습니다.");
closeEdit();
await loadAll();

}catch(error){

console.error(error);

message.className="message error";
message.textContent="수정 중 오류가 발생했습니다.";

}finally{

button.disabled=false;

}

}


async function deleteStudent(s){

if(!confirm(
s.name+
" 수련생을 정말 삭제하시겠습니까?\n\n"+
"학생을 삭제하면 출석기록과 부모님 알림등록도 함께 삭제됩니다.\n"+
"(그만둔 경우에는 삭제 대신 [수정 → 상태: 퇴원]을 추천합니다)"
))return;

try{

const result=await rpc(
"admin_delete_student",
{
admin_password:adminPassword,
student_id:s.id
}
);

if(!result.success){

alert(result.message);
return;

}

toast(s.name+" 수련생을 삭제했습니다.");
await loadAll();

}catch(error){

alert("삭제 중 오류가 발생했습니다.");

}

}
