<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>승리태권도 학부모 출석서비스</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f5f7fb;
  color:#17283d;
}

.wrap{
  max-width:480px;
  margin:0 auto;
  padding:45px 20px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:32px 24px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
  text-align:center;
}

h1{
  margin:0 0 8px;
  font-size:27px;
  color:#062b5c;
}

.sub{
  color:#687386;
  line-height:1.6;
  margin-bottom:27px;
}

.pin{
  width:100%;
  padding:18px;
  font-size:28px;
  text-align:center;
  letter-spacing:10px;
  border:2px solid #dce2ea;
  border-radius:14px;
  outline:none;
  margin-bottom:13px;
}

.pin:focus{
  border-color:#1769e0;
}

button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:14px;
  color:white;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  margin-bottom:10px;
}

button:disabled{
  opacity:.6;
}

.check-button{
  background:#1769e0;
}

.push-button{
  background:#17283d;
}

.message{
  margin-top:15px;
  font-size:16px;
  font-weight:700;
  line-height:1.6;
}

.notice{
  margin-top:20px;
  color:#8a94a3;
  font-size:13px;
  line-height:1.6;
}


/* =========================
   출석 결과
========================= */

#attendanceArea{
  display:none;
}

.check-icon{
  width:78px;
  height:78px;
  margin:0 auto 17px;
  border-radius:50%;
  background:#0aa34f;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:43px;
  font-weight:800;
}

.student-name{
  font-size:28px;
  font-weight:800;
  color:#062b5c;
}

.attendance-success{
  margin-top:10px;
  color:#079447;
  font-size:21px;
  font-weight:800;
}

.attendance-none{
  margin-top:10px;
  color:#df4a4a;
  font-size:19px;
  font-weight:800;
}

.attendance-time{
  margin-top:9px;
  color:#687386;
  font-size:17px;
}


/* 사진 */

.photo-section{
  display:none;
  margin-top:25px;
  padding-top:22px;
  border-top:1px solid #e5e9ef;
}

.photo-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:13px;
}

.attendance-photo{
  display:block;
  width:100%;
  max-height:500px;
  object-fit:contain;
  border-radius:16px;
  background:#f3f5f8;
}

.no-photo{
  margin-top:22px;
  padding:18px;
  border-radius:14px;
  background:#f5f7fa;
  color:#7b8797;
}


/* 로딩 */

#loadingArea{
  display:none;
}

.spinner{
  width:48px;
  height:48px;
  margin:10px auto 20px;
  border:5px solid #e1e7ee;
  border-top-color:#1769e0;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* 오류 */

#errorArea{
  display:none;
}

.error-icon{
  font-size:48px;
  margin-bottom:15px;
}

.error-text{
  font-size:17px;
  font-weight:700;
  line-height:1.6;
  color:#d74444;
}

.back-button{
  margin-top:20px;
  background:#17283d;
}


/* 일반 PIN 조회 결과 */

#normalResult{
  display:none;
  margin-top:25px;
  padding-top:22px;
  border-top:1px solid #e5e9ef;
  text-align:left;
}

.today-box{
  padding:20px 17px;
  border-radius:16px;
  background:#f5f7fb;
  text-align:center;
}

.today-name{
  font-size:21px;
  font-weight:800;
  margin-bottom:9px;
}

.today-success{
  color:#159447;
  font-size:19px;
  font-weight:800;
}

.today-none{
  color:#e14a4a;
  font-size:18px;
  font-weight:800;
}

.today-time{
  color:#687386;
  margin-top:7px;
}

.history-title{
  margin-top:23px;
  margin-bottom:9px;
  font-size:17px;
  font-weight:800;
}

.history-row{
  display:flex;
  justify-content:space-between;
  padding:13px 3px;
  border-bottom:1px solid #e7ebf0;
}

.history-date{
  font-weight:700;
}

.history-time{
  color:#1769e0;
  font-weight:700;
}

.empty{
  padding:20px 0;
  text-align:center;
  color:#8a94a3;
}
</style>
</head>


<body>

<div class="wrap">

<div class="card">


<!-- =========================
     로딩
========================= -->

<div id="loadingArea">

  <div class="spinner"></div>

  <div style="font-weight:700;">
    출석정보를 확인하고 있습니다...
  </div>

</div>


<!-- =========================
     알림에서 바로 들어온 화면
========================= -->

<div id="attendanceArea">

  <div class="check-icon">✓</div>

  <div
    id="tokenStudentName"
    class="student-name">
  </div>

  <div
    id="tokenAttendanceStatus"
    class="attendance-success">
  </div>

  <div
    id="tokenAttendanceTime"
    class="attendance-time">
  </div>


  <div
    id="photoSection"
    class="photo-section">

    <div class="photo-title">
      📷 오늘의 출석사진
    </div>

    <img
      id="attendancePhoto"
      class="attendance-photo"
      alt="출석사진"
    >

  </div>


  <div
    id="noPhoto"
    class="no-photo"
    style="display:none;">
    출석사진이 없습니다.
  </div>

</div>


<!-- =========================
     링크 오류
========================= -->

<div id="errorArea">

  <div class="error-icon">
    ⚠️
  </div>

  <div
    id="errorText"
    class="error-text">
  </div>

  <button
    class="back-button"
    onclick="showNormalScreen()">
    출석 확인 화면으로 이동
  </button>

</div>


<!-- =========================
     일반 학부모 화면
========================= -->

<div id="normalArea">

  <h1>
    🥋 용인대 승리태권도
  </h1>

  <div class="sub">
    학부모 출석 서비스<br>
    자녀의 출석을 확인하고 알림을 받아보세요.
  </div>


  <input
    id="pin"
    class="pin"
    type="tel"
    maxlength="4"
    inputmode="numeric"
    placeholder="0000"
  >


  <button
    id="checkBtn"
    class="check-button"
    onclick="checkAttendance()">
    ✅ 출석 확인하기
  </button>


  <button
    id="registerBtn"
    class="push-button"
    onclick="registerPush()">
    🔔 출석 알림 등록하기
  </button>


  <div
    id="message"
    class="message">
  </div>


  <div id="normalResult">

    <div
      id="todayBox"
      class="today-box">
    </div>

    <div class="history-title">
      최근 출석 기록
    </div>

    <div id="history"></div>

  </div>


  <div class="notice">
    알림 등록은 최초 1회만 하시면 됩니다.<br>
    알림을 놓치셨을 경우 언제든 출석 확인을 눌러주세요.
  </div>

</div>


</div>
</div>


<script>

const SUPABASE_URL =
"https://ixuxlblfkoccmwqxsjbw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lmwJJaHfZzE5hXnZnF49oA__F7JpDZ8";


/*
 * 기존에 사용 중인
 * VAPID 공개키
 */

const VAPID_PUBLIC_KEY =
"BOBiao0_8ypwHad3rAeVJ6m4q8A8Tt9gRTOqJEwyzJKgJ37nQ0k69fz-dQEcLcd6CQq3fu_6FSwb64o780EDqME";


/* =========================
   처음 페이지가 열릴 때
========================= */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const token =
      params.get("token");


    /*
     * 알림을 눌러서 들어온 경우
     */

    if(token){

      loadTokenAttendance(
        token
      );

    }else{

      showNormalScreen();

    }

  }
);


/* =========================
   알림 링크 출석 조회
========================= */

async function loadTokenAttendance(token){

  document.getElementById(
    "normalArea"
  ).style.display="none";

  document.getElementById(
    "attendanceArea"
  ).style.display="none";

  document.getElementById(
    "errorArea"
  ).style.display="none";

  document.getElementById(
    "loadingArea"
  ).style.display="block";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/functions/v1/get-attendance-photo",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          },

          body:JSON.stringify({
            token:token
          })
        }
      );


    const data =
      await response.json();


    document.getElementById(
      "loadingArea"
    ).style.display="none";


    if(
      !response.ok ||
      !data.success
    ){

      showTokenError(
        data.message ||
        "출석정보를 확인할 수 없습니다."
      );

      return;
    }


    document.getElementById(
      "tokenStudentName"
    ).textContent =
      data.name +
      " 수련생";


    /*
     * 오늘 출석
     */

    if(data.attended){

      document.getElementById(
        "tokenAttendanceStatus"
      ).className =
        "attendance-success";

      document.getElementById(
        "tokenAttendanceStatus"
      ).textContent =
        "오늘 출석했습니다.";


      document.getElementById(
        "tokenAttendanceTime"
      ).textContent =
        "출석시간 " +
        formatTime(
          data.checked_at
        );


      /*
       * 사진 있음
       */

      if(
        data.has_photo &&
        data.photo_url
      ){

        document.getElementById(
          "attendancePhoto"
        ).src =
          data.photo_url;

        document.getElementById(
          "photoSection"
        ).style.display =
          "block";

        document.getElementById(
          "noPhoto"
        ).style.display =
          "none";

      }else{

        document.getElementById(
          "photoSection"
        ).style.display =
          "none";

        document.getElementById(
          "noPhoto"
        ).style.display =
          "block";

      }

    }else{

      document.getElementById(
        "tokenAttendanceStatus"
      ).className =
        "attendance-none";

      document.getElementById(
        "tokenAttendanceStatus"
      ).textContent =
        "오늘 출석 기록이 없습니다.";


      document.getElementById(
        "tokenAttendanceTime"
      ).textContent =
        "";


      document.getElementById(
        "photoSection"
      ).style.display =
        "none";


      document.getElementById(
        "noPhoto"
      ).style.display =
        "none";

    }


    document.getElementById(
      "attendanceArea"
    ).style.display =
      "block";


  }catch(error){

    console.error(error);

    document.getElementById(
      "loadingArea"
    ).style.display =
      "none";

    showTokenError(
      "출석정보를 불러오지 못했습니다."
    );

  }

}


/* =========================
   오류
========================= */

function showTokenError(message){

  document.getElementById(
    "attendanceArea"
  ).style.display="none";

  document.getElementById(
    "normalArea"
  ).style.display="none";

  document.getElementById(
    "errorArea"
  ).style.display="block";

  document.getElementById(
    "errorText"
  ).textContent=message;

}


/* =========================
   일반 화면
========================= */

function showNormalScreen(){

  document.getElementById(
    "loadingArea"
  ).style.display="none";

  document.getElementById(
    "attendanceArea"
  ).style.display="none";

  document.getElementById(
    "errorArea"
  ).style.display="none";

  document.getElementById(
    "normalArea"
  ).style.display="block";

}


/* =========================
   날짜 / 시간
========================= */

function koreaDateString(){

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Seoul",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(
      new Date()
    );


  const value={};


  parts.forEach(p=>{
    value[p.type]=p.value;
  });


  return (
    value.year +
    "-" +
    value.month +
    "-" +
    value.day
  );

}


function formatDate(value){

  if(!value)return "";

  const p =
    value.split("-");


  return (
    Number(p[1]) +
    "월 " +
    Number(p[2]) +
    "일"
  );

}


function formatTime(value){

  if(!value)return "";

  return new Date(
    value
  ).toLocaleTimeString(
    "ko-KR",
    {
      timeZone:
        "Asia/Seoul",

      hour:
        "2-digit",

      minute:
        "2-digit"
    }
  );

}


/* =========================
   일반 PIN 출석 확인
========================= */

async function checkAttendance(){

  const pin =
    document.getElementById(
      "pin"
    ).value.trim();


  const message =
    document.getElementById(
      "message"
    );


  const button =
    document.getElementById(
      "checkBtn"
    );


  document.getElementById(
    "normalResult"
  ).style.display =
    "none";


  if(!/^\d{4}$/.test(pin)){

    message.textContent =
      "4자리 출석번호를 입력해주세요.";

    return;
  }


  try{

    button.disabled=true;

    message.textContent =
      "출석 기록을 확인하고 있습니다...";


    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/parent_attendance_history",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          },

          body:JSON.stringify({
            input_pin:pin
          })
        }
      );


    const data =
      await response.json();


    if(!data.success){

      message.textContent =
        data.message ||
        "출석 기록을 확인할 수 없습니다.";

      return;
    }


    message.textContent="";


    const records =
      Array.isArray(
        data.records
      )
        ? data.records
        : [];


    const today =
      koreaDateString();


    const todayRecord =
      records.find(
        r =>
          r.attendance_date ===
          today
      );


    const todayBox =
      document.getElementById(
        "todayBox"
      );


    if(todayRecord){

      todayBox.innerHTML =
        '<div class="today-name">' +
        escapeHtml(data.name) +
        '</div>' +

        '<div class="today-success">' +
        '✅ 오늘 출석했습니다.' +
        '</div>' +

        '<div class="today-time">' +
        '출석시간 ' +
        formatTime(
          todayRecord.checked_at
        ) +
        '</div>';

    }else{

      todayBox.innerHTML =
        '<div class="today-name">' +
        escapeHtml(data.name) +
        '</div>' +

        '<div class="today-none">' +
        '오늘 출석 기록이 없습니다.' +
        '</div>';

    }


    const history =
      document.getElementById(
        "history"
      );


    history.innerHTML="";


    if(records.length===0){

      history.innerHTML =
        '<div class="empty">' +
        '아직 출석 기록이 없습니다.' +
        '</div>';

    }else{

      records.forEach(
        record => {

          const row =
            document.createElement(
              "div"
            );


          row.className =
            "history-row";


          const date =
            document.createElement(
              "div"
            );


          date.className =
            "history-date";


          date.textContent =
            formatDate(
              record.attendance_date
            );


          const time =
            document.createElement(
              "div"
            );


          time.className =
            "history-time";


          time.textContent =
            "출석 " +
            formatTime(
              record.checked_at
            );


          row.appendChild(
            date
          );

          row.appendChild(
            time
          );


          history.appendChild(
            row
          );

        }
      );

    }


    document.getElementById(
      "normalResult"
    ).style.display =
      "block";


  }catch(error){

    console.error(error);

    message.textContent =
      "출석 확인 중 오류가 발생했습니다.";

  }finally{

    button.disabled=false;

  }

}


/* =========================
   HTML 안전 처리
========================= */

function escapeHtml(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   푸시 알림 등록
========================= */

function urlBase64ToUint8Array(
  base64String
){

  const padding =
    "=".repeat(
      (
        4 -
        base64String.length % 4
      ) % 4
    );


  const base64 =
    (
      base64String +
      padding
    )
      .replace(
        /-/g,
        "+"
      )
      .replace(
        /_/g,
        "/"
      );


  const rawData =
    window.atob(
      base64
    );


  return Uint8Array.from(
    [...rawData].map(
      char =>
        char.charCodeAt(0)
    )
  );

}


async function registerPush(){

  const pin =
    document.getElementById(
      "pin"
    ).value.trim();


  const message =
    document.getElementById(
      "message"
    );


  const button =
    document.getElementById(
      "registerBtn"
    );


  if(!/^\d{4}$/.test(pin)){

    message.textContent =
      "4자리 출석번호를 입력해주세요.";

    return;
  }


  if(
    !(
      "serviceWorker"
      in navigator
    )
  ){

    message.textContent =
      "이 브라우저에서는 알림 기능을 사용할 수 없습니다.";

    return;
  }


  if(
    !(
      "PushManager"
      in window
    )
  ){

    message.textContent =
      "이 기기에서는 푸시 알림을 지원하지 않습니다.";

    return;
  }


  try{

    button.disabled=true;

    message.textContent =
      "알림 등록 중입니다...";


    const permission =
      await Notification
        .requestPermission();


    if(
      permission !==
      "granted"
    ){

      message.textContent =
        "알림 권한을 허용해주세요.";

      return;
    }


    const registration =
      await navigator
        .serviceWorker
        .register(
          "/sw.js"
        );


    await navigator
      .serviceWorker
      .ready;


    let subscription =
      await registration
        .pushManager
        .getSubscription();


    if(!subscription){

      subscription =
        await registration
          .pushManager
          .subscribe({
            userVisibleOnly:
              true,

            applicationServerKey:
              urlBase64ToUint8Array(
                VAPID_PUBLIC_KEY
              )
          });

    }


    const json =
      subscription.toJSON();


    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/register_parent_push",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          },

          body:JSON.stringify({

            input_pin:
              pin,

            input_endpoint:
              json.endpoint,

            input_p256dh:
              json.keys.p256dh,

            input_auth:
              json.keys.auth

          })
        }
      );


    const data =
      await response.json();


    if(data.success){

      message.textContent =
        "✅ " +
        data.name +
        " 수련생 출석 알림 등록 완료!";

    }else{

      message.textContent =
        data.message ||
        "알림 등록에 실패했습니다.";

    }


  }catch(error){

    console.error(error);

    message.textContent =
      "알림 등록 중 오류가 발생했습니다.";

  }finally{

    button.disabled=false;

  }

}

</script>
