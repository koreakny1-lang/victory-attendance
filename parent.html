<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>승리태권도 학부모 출석서비스</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f5f7fb;
  color:#17283d;
}

.wrap{
  max-width:480px;
  margin:0 auto;
  padding:55px 20px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:35px 25px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
  text-align:center;
}

h1{
  font-size:27px;
  margin:0 0 8px;
}

.sub{
  color:#687386;
  line-height:1.6;
  margin-bottom:28px;
}

.pin{
  width:100%;
  padding:18px;
  font-size:28px;
  text-align:center;
  letter-spacing:10px;
  border:2px solid #dce2ea;
  border-radius:14px;
  outline:none;
  margin-bottom:13px;
}

.pin:focus{
  border-color:#1769e0;
}

button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:14px;
  color:white;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  margin-bottom:10px;
}

button:disabled{
  opacity:.6;
}

.check-button{
  background:#1769e0;
}

.push-button{
  background:#17283d;
}

#message{
  margin-top:15px;
  font-size:16px;
  font-weight:700;
  line-height:1.6;
}

.notice{
  margin-top:20px;
  color:#8a94a3;
  font-size:13px;
  line-height:1.6;
}

/* 출석 결과 */

#attendanceArea{
  display:none;
  margin-top:25px;
  text-align:left;
}

.today-box{
  padding:22px 18px;
  border-radius:16px;
  background:#f5f7fb;
  text-align:center;
}

.today-name{
  font-size:21px;
  font-weight:800;
  margin-bottom:10px;
}

.today-success{
  color:#159447;
  font-size:20px;
  font-weight:800;
}

.today-none{
  color:#e14a4a;
  font-size:18px;
  font-weight:800;
}

.today-time{
  color:#687386;
  margin-top:8px;
  font-size:15px;
}

.history-title{
  margin-top:25px;
  margin-bottom:10px;
  font-size:17px;
  font-weight:800;
}

.history{
  border-top:1px solid #e7ebf0;
}

.history-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 3px;
  border-bottom:1px solid #e7ebf0;
}

.history-date{
  font-weight:700;
}

.history-time{
  color:#1769e0;
  font-weight:700;
}

.empty{
  padding:20px 0;
  text-align:center;
  color:#8a94a3;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1>🥋 용인대 승리태권도</h1>

<div class="sub">
학부모 출석 서비스<br>
자녀의 출석을 확인하고 알림을 받아보세요.
</div>

<input
  id="pin"
  class="pin"
  type="tel"
  maxlength="4"
  inputmode="numeric"
  placeholder="0000"
  onkeydown="if(event.key==='Enter') checkAttendance()"
>

<button
  id="checkBtn"
  class="check-button"
  onclick="checkAttendance()">
  ✅ 출석 확인하기
</button>

<button
  id="registerBtn"
  class="push-button"
  onclick="registerPush()">
  🔔 출석 알림 등록하기
</button>

<div id="message"></div>


<!-- 출석 결과 -->

<div id="attendanceArea">

  <div id="todayBox" class="today-box"></div>

  <div class="history-title">
    최근 출석 기록
  </div>

  <div id="history" class="history"></div>

</div>


<div class="notice">
알림 등록은 최초 1회만 하시면 됩니다.<br>
알림을 놓치셨을 경우 언제든 출석 확인을 눌러주세요.
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://ixuxlblfkoccmwqxsjbw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lmwJJaHfZzE5hXnZnF49oA__F7JpDZ8";

const VAPID_PUBLIC_KEY =
"BOBiao0_8ypwHad3rAeVJ6m4q8A8Tt9gRTOqJEwyzJKgJ37nQ0k69fz-dQEcLcd6CQq3fu_6FSwb64o780EDqME";


/* =========================
   공통
========================= */

function getPin(){

  return document
    .getElementById("pin")
    .value.trim();

}


function showMessage(text){

  document.getElementById("message")
    .textContent=text;

}


function koreaDateString(){

  const parts=
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Seoul",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(new Date());

  const value={};

  parts.forEach(p=>{
    value[p.type]=p.value;
  });

  return (
    value.year+"-"+
    value.month+"-"+
    value.day
  );
}


function formatDate(value){

  const p=value.split("-");

  if(p.length!==3)
    return value;

  return (
    Number(p[1])+
    "월 "+
    Number(p[2])+
    "일"
  );

}


function formatTime(value){

  if(!value)return "";

  const date=new Date(value);

  return date.toLocaleTimeString(
    "ko-KR",
    {
      timeZone:"Asia/Seoul",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   출석 확인
========================= */

async function checkAttendance(){

  const pin=getPin();

  const button=
    document.getElementById("checkBtn");

  const area=
    document.getElementById("attendanceArea");


  area.style.display="none";


  if(!/^\d{4}$/.test(pin)){

    showMessage(
      "4자리 출석번호를 입력해주세요."
    );

    return;
  }


  try{

    button.disabled=true;

    showMessage(
      "출석 기록을 확인하고 있습니다..."
    );


    const response=
      await fetch(
        SUPABASE_URL+
        "/rest/v1/rpc/parent_attendance_history",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer "+SUPABASE_KEY
          },

          body:JSON.stringify({
            input_pin:pin
          })
        }
      );


    const data=
      await response.json();


    if(!data.success){

      showMessage(
        data.message ||
        "출석 기록을 확인할 수 없습니다."
      );

      return;
    }


    showMessage("");


    const records=
      Array.isArray(data.records)
      ? data.records
      : [];


    const today=
      koreaDateString();


    const todayRecord=
      records.find(
        r=>r.attendance_date===today
      );


    const todayBox=
      document.getElementById("todayBox");


    if(todayRecord){

      todayBox.innerHTML=
        '<div class="today-name">'+
        escapeHtml(data.name)+
        '</div>'+
        '<div class="today-success">'+
        '✅ 오늘 출석했습니다.'+
        '</div>'+
        '<div class="today-time">'+
        '출석시간 '+
        formatTime(todayRecord.checked_at)+
        '</div>';

    }else{

      todayBox.innerHTML=
        '<div class="today-name">'+
        escapeHtml(data.name)+
        '</div>'+
        '<div class="today-none">'+
        '오늘 출석 기록이 없습니다.'+
        '</div>';

    }


    const history=
      document.getElementById("history");

    history.innerHTML="";


    if(records.length===0){

      history.innerHTML=
        '<div class="empty">'+
        '아직 출석 기록이 없습니다.'+
        '</div>';

    }else{

      records.forEach(r=>{

        const row=
          document.createElement("div");

        row.className="history-row";


        const date=
          document.createElement("div");

        date.className="history-date";

        date.textContent=
          formatDate(
            r.attendance_date
          );


        const time=
          document.createElement("div");

        time.className="history-time";

        time.textContent=
          "출석 "+
          formatTime(r.checked_at);


        row.appendChild(date);
        row.appendChild(time);

        history.appendChild(row);

      });

    }


    area.style.display="block";


  }catch(error){

    console.error(error);

    showMessage(
      "출석 확인 중 오류가 발생했습니다."
    );

  }finally{

    button.disabled=false;

  }

}


/* =========================
   푸시 알림
========================= */

function urlBase64ToUint8Array(
  base64String
){

  const padding=
    "=".repeat(
      (4-base64String.length%4)%4
    );

  const base64=
    (base64String+padding)
      .replace(/-/g,"+")
      .replace(/_/g,"/");

  const rawData=
    window.atob(base64);

  return Uint8Array.from(
    [...rawData].map(
      char=>char.charCodeAt(0)
    )
  );

}


async function registerPush(){

  const pin=getPin();

  const button=
    document.getElementById(
      "registerBtn"
    );


  if(!/^\d{4}$/.test(pin)){

    showMessage(
      "4자리 출석번호를 입력해주세요."
    );

    return;
  }


  if(!("serviceWorker" in navigator)){

    showMessage(
      "이 브라우저에서는 알림 기능을 사용할 수 없습니다."
    );

    return;
  }


  if(!("PushManager" in window)){

    showMessage(
      "이 기기에서는 푸시 알림을 지원하지 않습니다."
    );

    return;
  }


  try{

    button.disabled=true;

    showMessage(
      "알림 등록 중입니다..."
    );


    const permission=
      await Notification
      .requestPermission();


    if(permission!=="granted"){

      showMessage(
        "알림 권한을 허용해주세요."
      );

      return;
    }


    const registration=
      await navigator.serviceWorker
      .register("/sw.js");


    await navigator.serviceWorker.ready;


    let subscription=
      await registration
      .pushManager
      .getSubscription();


    if(!subscription){

      subscription=
        await registration
        .pushManager
        .subscribe({
          userVisibleOnly:true,
          applicationServerKey:
            urlBase64ToUint8Array(
              VAPID_PUBLIC_KEY
            )
        });

    }


    const json=
      subscription.toJSON();


    const response=
      await fetch(
        SUPABASE_URL+
        "/rest/v1/rpc/register_parent_push",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer "+
              SUPABASE_KEY
          },

          body:JSON.stringify({
            input_pin:pin,
            input_endpoint:
              json.endpoint,
            input_p256dh:
              json.keys.p256dh,
            input_auth:
              json.keys.auth
          })
        }
      );


    const data=
      await response.json();


    if(data.success){

      showMessage(
        "✅ "+
        data.name+
        " 수련생 출석 알림 등록 완료!"
      );

    }else{

      showMessage(
        data.message ||
        "알림 등록에 실패했습니다."
      );

    }


  }catch(error){

    console.error(error);

    showMessage(
      "알림 등록 중 오류가 발생했습니다."
    );

  }finally{

    button.disabled=false;

  }

}

</script>

</body>
</html>
